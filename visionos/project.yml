# Generates PS5Vision.xcodeproj: run `xcodegen` in this folder (brew install xcodegen),
# or just `npm run vision` from the project root.
name: PS5Vision
options:
  bundleIdPrefix: io.github.ps5vision
  deploymentTarget:
    visionOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    # Set your own team in Xcode (Signing & Capabilities) to run on a headset.
    DEVELOPMENT_TEAM: ""
    # The name people see: on the home view, in the app and in the App Store.
    # It has to be a name of your own. Apple turns away apps named after
    # someone else's product, so "PS5" and "PlayStation" can't be in it.
    APP_NAME: Lookplay
targets:
  PS5Vision:
    type: application
    platform: visionOS
    sources:
      - path: PS5Vision
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.themaninhollywood.lookplay
        PRODUCT_NAME: $(APP_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: PS5Vision/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "7"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
